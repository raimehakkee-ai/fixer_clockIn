# Contoh vhost staging ClockIn.
# Ganti domain, path sertifikat, dan port API sesuai environment.
#
# Mobile web : https://staging-clockin.example.com
# Admin      : https://staging-clockin-admin.example.com
# API        : proxy same-origin /api/ ke 127.0.0.1:4100

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-clockin.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging-clockin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-clockin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/clockin-staging/mobile;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-clockin-admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging-clockin-admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-clockin-admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/clockin-staging/admin;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
