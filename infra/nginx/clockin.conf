# /etc/nginx/sites-available/clockin.conf
#
# Prasyarat pada blok http {} di /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=clockin_api:10m rate=20r/s;
#
# Salin snippet header ke /etc/nginx/snippets/:
#   clockin-security-headers.conf
#   clockin-csp.conf
#
# Jangan pernah mengekspos folder uploads secara langsung; media hanya
# diambil melalui API ber-otorisasi.

server {
    listen 80;
    server_name absensi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name absensi.example.com;

    ssl_certificate     /etc/letsencrypt/live/absensi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absensi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    server_tokens off;

    root /var/www/clockin/admin;
    index index.html;

    # SPA Web Admin
    location / {
        include /etc/nginx/snippets/clockin-security-headers.conf;
        include /etc/nginx/snippets/clockin-csp.conf;
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        include /etc/nginx/snippets/clockin-security-headers.conf;
        limit_req zone=clockin_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Folder media tidak boleh diakses langsung.
    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    location ^~ /server/ {
        deny all;
        return 404;
    }
}
