name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck
      - run: npm test

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clockin
          POSTGRES_PASSWORD: clockin
          POSTGRES_DB: clockin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clockin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clockin:clockin@localhost:5432/clockin
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173,http://localhost:8081
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Start API
        run: |
          nohup npm run dev > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - run: npm run smoke
      - name: Restart API (reset rate limiter)
        run: |
          pkill -f "src/index.ts" || true
          nohup npm run dev > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - run: npm run smoke:security

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
